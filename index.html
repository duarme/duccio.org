<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duccio Armenise</title>
  <meta name="description" content="Indie dev. Building Corsidia, uCV, Esmerise.">
  <meta property="og:title" content="Duccio Armenise">
  <meta property="og:description" content="Indie dev. Building Corsidia, uCV, Esmerise.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://duccio.org">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #1f2328;
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 16px;
    }

    /* Profile */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 32px;
    }

    .avatar {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      border: 1px solid #d1d9e0;
      margin-bottom: 16px;
      object-fit: cover;
    }

    .name {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .bio {
      font-size: 16px;
      color: #59636e;
      max-width: 480px;
      margin-bottom: 16px;
    }

    /* Links */
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin-bottom: 40px;
    }

    .links a {
      color: #0969da;
      text-decoration: none;
      font-size: 14px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    /* Section heading */
    .section-heading {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #d1d9e0;
    }

    /* Portfolio cards */
    .portfolio {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 40px;
    }

    @media (min-width: 480px) {
      .portfolio {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      border: 1px solid #d1d9e0;
      border-radius: 6px;
      padding: 16px;
    }

    .card-name {
      font-size: 14px;
      font-weight: 600;
    }

    .card-name a {
      color: #0969da;
      text-decoration: none;
    }

    .card-name a:hover {
      text-decoration: underline;
    }

    .card-desc {
      font-size: 12px;
      color: #59636e;
      margin-top: 8px;
    }

    /* Footer */
    footer {
      text-align: center;
      font-size: 12px;
      color: #59636e;
      padding-top: 24px;
      border-top: 1px solid #d1d9e0;
    }
  </style>
</head>
<body>
  <main class="container">

    <section class="profile">
      <img class="avatar" src="duccio-armenise.png" alt="Duccio Armenise">
      <h1 class="name">Duccio Armenise</h1>
      <p class="bio">Indie dev. Building Corsidia, uCV, Esmerise.</p>
    </section>

    <nav class="links">
      <a href="https://x.com/DuccioArmenise">X</a>
      <a href="https://youtube.com/@IndieDuccio">YouTube</a>
      <a href="https://github.com/duarme">GitHub</a>
      <a href="https://linkedin.com/in/duccioarmenise">LinkedIn</a>
      <a href="https://duccio.ucv.jobs">uCV</a>
    </nav>

    <h2 class="section-heading">Projects</h2>
    <div class="portfolio">
      <div class="card">
        <div class="card-name"><a href="https://corsidia.com">Corsidia</a></div>
        <p class="card-desc">Find the best courses near you.</p>
      </div>
      <div class="card">
        <div class="card-name"><a href="https://ucv.jobs">uCV</a></div>
        <p class="card-desc">Your CV, always up to date.</p>
      </div>
      <div class="card">
        <div class="card-name"><a href="https://esmerise.com">Esmerise</a></div>
        <p class="card-desc">A better way to learn online.</p>
      </div>
    </div>

    <footer>duccio.org</footer>

  </main>
</body>
</html>
